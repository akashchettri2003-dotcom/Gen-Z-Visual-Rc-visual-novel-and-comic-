<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0">

<title>Comics — GEN-VISUAL</title>

<link
    rel="stylesheet"
    href="css/style.css">

</head>


<body data-page="comics">


<header class="header">

    <nav class="nav">

        <a
            class="logo"
            href="index.html">
            GEN-<span>VISUAL</span>
        </a>


        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="novels.html">Novels</a>

            <a href="comics.html">Comics</a>

            <a
                class="btn btn-secondary"
                href="login.html">
                My Account
            </a>

        </div>


        <button
            id="menuBtn"
            class="menu-btn">
            ☰
        </button>

    </nav>


    <div
        id="mobileMenu"
        class="mobile-menu">

        <a href="index.html">🏠 Home</a>

        <a href="novels.html">📖 Novels</a>

        <a href="comics.html">🎨 Comics</a>

        <a href="login.html">👤 My Account</a>

    </div>

</header>


<main class="container">


<section class="hero">

    <span class="badge">
        🎨 GEN-VISUAL COMICS
    </span>

    <h1>
        Enter
        <span class="gradient">
            new worlds.
        </span>
    </h1>

    <p>
        Discover original comic series and
        follow every new episode.
    </p>

</section>


<section class="section">

    <div class="section-title">

        <h2>Comics</h2>

        <p>
            Browse our growing collection.
        </p>

    </div>


    <div class="search">

        <input
            id="search"
            type="search"
            placeholder="Search comics or genres...">

    </div>


    <div class="filters">

        <button
            class="filter active"
            data-genre="all">
            All
        </button>

        <button
            class="filter"
            data-genre="action">
            Action
        </button>

        <button
            class="filter"
            data-genre="fantasy">
            Fantasy
        </button>

    </div>


    <div
        id="content"
        class="grid">
    </div>

</section>

</main>


<footer>

    <p>
        © 2026 GEN-VISUAL / RC Visual
    </p>

</footer>


<script src="js/app.js"></script>
