<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login — GEN-VISUAL</title>

<meta name="description"
      content="Login or create your GEN-VISUAL reader account.">


<style>

/* ==============================
   ROOT
============================== */

:root{

    --bg:#08090d;

    --card:#12151e;

    --card2:#171b27;

    --text:#f5f7ff;

    --muted:#9da5b8;

    --primary:#8b5cf6;

    --primary2:#6366f1;

    --border:rgba(255,255,255,.09);

    --danger:#ef4444;

    --success:#22c55e;

}


/* ==============================
   RESET
============================== */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height:100vh;

    color:var(--text);

    background:

        radial-gradient(
            circle at top left,
            rgba(99,102,241,.15),
            transparent 35%
        ),

        radial-gradient(
            circle at bottom right,
            rgba(139,92,246,.12),
            transparent 35%
        ),

        var(--bg);

}


a{

    color:inherit;

    text-decoration:none;

}


button,
input{

    font:inherit;

}


/* ==============================
   HEADER
============================== */

header{

    height:70px;

    border-bottom:
        1px solid var(--border);

    background:
        rgba(8,9,13,.88);

    backdrop-filter:
        blur(15px);

}


.navbar{

    width:min(1150px,92%);

    height:100%;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:space-between;

}


.logo{

    font-size:22px;

    font-weight:900;

    letter-spacing:1px;

}


.logo span{

    color:var(--primary);

}


.home-link{

    color:var(--muted);

    font-size:14px;

    padding:9px 13px;

    border:
        1px solid var(--border);

    border-radius:10px;

    transition:.2s;

}


.home-link:hover{

    color:white;

    border-color:
        rgba(139,92,246,.5);

}


/* ==============================
   MAIN
============================== */

main{

    min-height:
        calc(100vh - 70px);

    display:flex;

    justify-content:center;

    align-items:center;

    padding:50px 20px;

}


/* ==============================
   AUTH BOX
============================== */

.auth-container{

    width:min(440px,100%);

}


.auth-card{

    background:
        linear-gradient(
            180deg,
            var(--card2),
            var(--card)
        );

    border:
        1px solid var(--border);

    border-radius:22px;

    padding:32px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.35);

}


.brand-icon{

    width:58px;

    height:58px;

    margin:0 auto 20px;

    border-radius:17px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:27px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );

    box-shadow:
        0 10px 30px
        rgba(99,102,241,.25);

}


.auth-card h1{

    text-align:center;

    font-size:30px;

    margin-bottom:9px;

}


.subtitle{

    text-align:center;

    color:var(--muted);

    font-size:14px;

    line-height:1.6;

    margin-bottom:28px;

}


/* ==============================
   TABS
============================== */

.tabs{

    display:grid;

    grid-template-columns:1fr 1fr;

    background:#0d1017;

    border:
        1px solid var(--border);

    padding:4px;

    border-radius:12px;

    margin-bottom:25px;

}


.tab{

    border:0;

    background:transparent;

    color:var(--muted);

    padding:11px;

    border-radius:9px;

    cursor:pointer;

    font-weight:700;

}


.tab.active{

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );

    color:white;

}


/* ==============================
   FORM
============================== */
